stages:
  - test
  - quality
  
run_api_script:
  stage: test
  image: python:3.10
  script:
    - pip install requests
    - python3 main.py
  artifacts:
    paths:
      - report.json

sonarqube-check:
  stage: quality
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner -Dsonar.login=$SONAR_TOKEN
  only:
    - main
    - develop
  allow_failure: true
